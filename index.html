
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronaut in Space</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #050816, #172554);
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
        }

        nav h2 {
            color: #60a5fa;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 40px 8%;
            gap: 30px;
        }

        .content {
            max-width: 500px;
        }

        h1 {
            font-size: 48px;
            color: #93c5fd;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #60a5fa;
        }

        .astronaut {
            font-size: 160px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #cbd5e1;
        }

        @media (max-width: 650px) {
            nav {
                flex-wrap: wrap;
                gap: 15px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
            }

            h1 {
                font-size: 36px;
            }

            .astronaut {
                font-size: 110px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>🚀 Space Explorer</h2>
        <div>
            <a href="#">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="about">
        <div class="content">
            <h1>Explore the Universe</h1>

            <p>
                Dream big, explore beyond the stars,
                and discover the mysteries of space.
                Your next adventure begins here!
            </p>

            <button onclick="alert('Welcome, Space Explorer! 🚀')">
                Start Exploring
            </button>
        </div>

        <div class="astronaut">👨‍🚀</div>
    </section>

    <footer id="contact">
        <p>© 2026 Space Explorer | Reach for the Stars ✨</p>
    </footer>

</body>
</html>
